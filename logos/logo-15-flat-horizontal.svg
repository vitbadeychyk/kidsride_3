<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 72" fill="none">
  <!-- Two-tone pill background split -->
  <rect x="0" y="0" width="180" height="72" rx="36" fill="#1B2A4A"/>
  <rect x="144" y="0" width="216" height="72" rx="36" fill="#FF6B35"/>
  <rect x="144" y="0" width="72" height="72" fill="#FF6B35"/>
  <rect x="144" y="0" width="36" height="72" fill="#1B2A4A"/>
  <!-- Left text: Kids white -->
  <text x="28" y="46" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="800" font-size="36" letter-spacing="-1" fill="white">Kids</text>
  <!-- Right text: Ride white -->
  <text x="176" y="46" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="800" font-size="36" letter-spacing="-1" fill="white">Ride</text>
</svg>
