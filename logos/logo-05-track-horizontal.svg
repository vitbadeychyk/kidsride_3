<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" fill="none">
  <!-- Road/track symbol — two parallel arcs with center dash -->
  <path d="M12 64 Q12 12 44 12" stroke="#1B2A4A" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M28 64 Q28 28 44 28" stroke="#FF6B35" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- Wheel at end -->
  <circle cx="56" cy="40" r="22" stroke="#1B2A4A" stroke-width="5" fill="none"/>
  <circle cx="56" cy="40" r="10" stroke="#FF6B35" stroke-width="4" fill="none"/>
  <circle cx="56" cy="40" r="4" fill="#1B2A4A"/>
  <!-- Wordmark -->
  <text x="94" y="52" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="34" letter-spacing="-0.5" fill="#1B2A4A">Kids<tspan fill="#FF6B35">Ride</tspan></text>
  <!-- Tagline -->
  <text x="96" y="68" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="400" font-size="10" letter-spacing="3" fill="#9ba5b4">ДИТЯЧИЙ ТРАНСПОРТ</text>
</svg>
