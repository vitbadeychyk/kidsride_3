<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 72" fill="none">
  <!-- Pill/badge left block -->
  <rect x="0" y="4" width="76" height="64" rx="16" fill="#1B2A4A"/>
  <!-- KR monogram inside -->
  <text x="10" y="50" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="900" font-size="38" fill="#FF6B35" letter-spacing="-2">KR</text>
  <!-- Divider dot -->
  <circle cx="96" cy="36" r="4" fill="#FF6B35"/>
  <!-- Wordmark -->
  <text x="112" y="50" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="300" font-size="30" letter-spacing="2" fill="#1B2A4A">KIDS</text>
  <text x="204" y="50" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="30" letter-spacing="2" fill="#1B2A4A">RIDE</text>
  <!-- Underline accent -->
  <rect x="112" y="58" width="190" height="3" rx="1.5" fill="#FF6B35"/>
</svg>
