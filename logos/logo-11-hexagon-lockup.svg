<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 76" fill="none">
  <!-- Hexagon mark -->
  <polygon points="38,4 66,20 66,52 38,68 10,52 10,20" fill="#1B2A4A"/>
  <polygon points="38,12 58,24 58,48 38,60 18,48 18,24" fill="#FF6B35"/>
  <!-- K inside -->
  <line x1="28" y1="24" x2="28" y2="52" stroke="white" stroke-width="5" stroke-linecap="round"/>
  <line x1="28" y1="38" x2="46" y2="24" stroke="white" stroke-width="5" stroke-linecap="round"/>
  <line x1="28" y1="38" x2="46" y2="52" stroke="white" stroke-width="5" stroke-linecap="round"/>
  <!-- Vertical separator -->
  <line x1="86" y1="12" x2="86" y2="60" stroke="#e5e7eb" stroke-width="1.5"/>
  <!-- Stacked wordmark -->
  <text x="100" y="33" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="300" font-size="14" letter-spacing="5" fill="#6b7280">KIDS</text>
  <text x="98" y="60" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="900" font-size="32" letter-spacing="-1" fill="#1B2A4A">RIDE</text>
  <!-- Orange accent bar -->
  <rect x="100" y="62" width="5" height="5" rx="1" fill="#FF6B35"/>
</svg>
